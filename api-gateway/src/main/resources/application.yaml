server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8760/eureka

#For security filtering skipping else filter will block also work without this to
management:
  endpoints:
    web:
      exposure:
        include: "*"
